name: Build and Deploy via SSH

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build do projeto
        run: bun run build

      - name: Garantir .htaccess e favicon no dist
        run: |
          if [ -f public/.htaccess ] && [ ! -f dist/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi
          if [ -f public/favicon.ico ] && [ ! -f dist/favicon.ico ]; then
            cp public/favicon.ico dist/favicon.ico
          fi
          echo "Conteúdo final do dist/:"
          ls -la dist/

      - name: Deploy via SSH (rsync)
        uses: easingthemes/ssh-deploy@v4.1.10
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST || 'servidori9.com.br' }}
          REMOTE_USER: ${{ secrets.REMOTE_USER || 'maestro-deploy' }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT || '22' }}
          SOURCE: "dist/"
          TARGET: "/maestro.aodigital.net.br/httpdocs"
          ARGS: "-rlgoDzvc -i --delete-after"
          EXCLUDE: ".git/, .github/, node_modules/"
