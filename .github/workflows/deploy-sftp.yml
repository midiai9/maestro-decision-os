name: Build and Deploy via SSH

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build do projeto
        run: bun run build

      - name: Garantir .htaccess e favicon no dist
        run: |
          if [ -f public/.htaccess ] && [ ! -f dist/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi
          if [ -f public/favicon.ico ] && [ ! -f dist/favicon.ico ]; then
            cp public/favicon.ico dist/favicon.ico
          fi
          echo "Conteúdo final do dist/:"
          ls -la dist/

      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./dist/ maestro-deploy@servidori9.com.br:/maestro.aodigital.net.br/httpdocs/
          rm ~/.ssh/deploy_key
