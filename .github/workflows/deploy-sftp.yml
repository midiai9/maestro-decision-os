name: Build and Deploy via SSH

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build do projeto
        run: bun run build

      - name: Garantir .htaccess e favicon no dist
        run: |
          if [ -f public/.htaccess ] && [ ! -f dist/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi
          if [ -f public/favicon.ico ] && [ ! -f dist/favicon.ico ]; then
            cp public/favicon.ico dist/favicon.ico
          fi
          echo "Conteúdo final do dist/:"
          ls -la dist/

      - name: Deploy via FTP (com retry)
        run: |
          cd dist
          sudo apt-get install -y lftp
          n=0
          until [ $n -ge 4 ]; do
            lftp -u "${{ secrets.SFTP_USER }},${{ secrets.SFTP_PASS }}" \
              -e "set net:max-retries 3; set net:timeout 25; set net:reconnect-interval-base 5; set net:persist-retries 3; mirror -e -R ./ ./; bye" \
              "${{ secrets.SFTP_HOST }}" && break
            n=$((n+1))
            echo "::warning::FTP tentativa $n falhou; novo retry em 8s"
            sleep 8
          done
          if [ $n -ge 4 ]; then echo "::error::FTP falhou apos 4 tentativas"; exit 1; fi
          echo "FTP concluido com sucesso"

      - name: Ajustar permissões via lftp
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          lftp -u "$SFTP_USER,$SFTP_PASS" "$SFTP_HOST" <<EOF
          glob -a chmod 644 *
          glob -a chmod 644 .htaccess
          glob -a chmod 644 .nojekyll
          chmod 755 assets
          glob chmod 644 assets/*
          chmod 755 logos
          glob chmod 644 logos/*
          bye
          EOF
        continue-on-error: true
