name: Build and Deploy via SFTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build do projeto
        run: bun run build

      - name: Garantir .htaccess no dist
        run: |
          if [ -f public/.htaccess ] && [ ! -f dist/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi
          if [ -f public/favicon.ico ] && [ ! -f dist/favicon.ico ]; then
            cp public/favicon.ico dist/favicon.ico
          fi
          echo "Conteúdo final do dist/:"
          ls -la dist/

      - name: Deploy via SFTP
        uses: wangyucode/sftp-upload-action@v0.1.2
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          localDir: 'dist/'
          remoteDir: '/maestro.aodigital.net.br/httpdocs'
          dryRun: false
          forceUpload: true
