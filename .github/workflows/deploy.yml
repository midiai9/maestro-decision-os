name: Build and Deploy to Production Branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build do projeto
        run: bun run build

      - name: Garantir .htaccess no dist
        run: |
          if [ -f public/.htaccess ] && [ ! -f dist/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi
          # Copiar config do Plesk para referência no servidor (opcional)
          if [ -f .plesk-webhook-config.json ]; then
            cp .plesk-webhook-config.json dist/.plesk-webhook-config.json
          fi

      - name: Criar .nojekyll (evita processamento indevido)
        run: touch dist/.nojekyll

      - name: Deploy para branch production
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: production
          force_orphan: true
          enable_jekyll: false
          commit_message: 'deploy: build automático ${{ github.sha }}'
          # Preserva arquivos padrão do Plesk que possam existir na branch
          exclude_assets: '.plesk,error_docs,cgi-bin,stats,logs'

      - name: Notificar Plesk Webhook
        if: success()
        env:
          PLESK_WEBHOOK_URL: ${{ secrets.PLESK_WEBHOOK_URL }}
          PLESK_WEBHOOK_SECRET: ${{ secrets.PLESK_WEBHOOK_SECRET }}
        run: |
          if [ -z "$PLESK_WEBHOOK_URL" ]; then
            echo "PLESK_WEBHOOK_URL não configurado — pulando notificação."
            exit 0
          fi
          PAYLOAD=$(cat <<EOF
          {
            "repository": "${{ github.repository }}",
            "branch": "production",
            "commit": "${{ github.sha }}",
            "action": "deploy",
            "domain": "maestro.aodigital.net.br"
          }
          EOF
          )
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$PLESK_WEBHOOK_SECRET" | awk '{print $2}')
          HTTP_CODE=$(curl -s -o /tmp/plesk_response.txt -w "%{http_code}" \
            -X POST "$PLESK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            -H "X-Deploy-Source: github-actions" \
            -d "$PAYLOAD" || echo "000")
          echo "Plesk respondeu HTTP $HTTP_CODE"
          cat /tmp/plesk_response.txt || true
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "204" ]; then
            echo "::warning::Webhook do Plesk retornou status $HTTP_CODE — verifique a configuração no painel."
          fi
